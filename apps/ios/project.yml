name: ZeroKeyMate
options:
  bundleIdPrefix: com.zerokeymate
  developmentLanguage: en
  deploymentTarget:
    iOS: '26.0'
  xcodeVersion: '26.3'
packages:
  MateCore:
    path: ../..
  Privy:
    url: https://github.com/privy-io/privy-ios.git
    exactVersion: 2.15.0
  Verity:
    path: ../../.tools/verity
settings:
  base:
    SWIFT_VERSION: '5.0'
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: '26.0'
    TARGETED_DEVICE_FAMILY: '1'
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: '$(MATE_DEVELOPMENT_TEAM)'
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: '0.3.0'
    CURRENT_PROJECT_VERSION: '3'
    SWIFT_ACTIVE_COMPILATION_CONDITIONS: '$(inherited) ${MATE_SWIFT_RUNTIME_FLAG}'
targets:
  ZeroKeyMate:
    type: application
    platform: iOS
    sources:
      - path: ZeroKeyMate
        excludes: ['Info.plist']
    dependencies:
      - package: MateCore
      - package: Privy
      - package: Verity
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: com.zerokeymate.companion
        INFOPLIST_KEY_CFBundleDisplayName: Mate
        INFOPLIST_KEY_NSCameraUsageDescription: Recognize your surroundings on this device and enable DockKit tracking. Video is never saved or sent externally.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Use on-device speech recognition only after you tap Talk.
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: Transcribe speech on this device. Use the keyboard when on-device recognition is unavailable.
        INFOPLIST_KEY_NSFaceIDUsageDescription: Authenticate when you approve the displayed mandate terms or test USDC operation.
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Send only approved request content to the specialist service running on your Mac.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: YES
    info:
      path: Generated/Info.plist
      properties:
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
  NativeAcceptance:
    type: bundle.unit-test
    platform: iOS
    sources: [NativeAcceptance]
    dependencies:
      - target: ZeroKeyMate
      - package: MateCore
      - package: Verity
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zerokeymate.native-acceptance
        TEST_HOST: '$(BUILT_PRODUCTS_DIR)/ZeroKeyMate.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/ZeroKeyMate'
        BUNDLE_LOADER: '$(TEST_HOST)'
  ProductUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [ProductUITests]
    dependencies:
      - target: ZeroKeyMate
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zerokeymate.product-ui-tests
        TEST_TARGET_NAME: ZeroKeyMate
schemes:
  ZeroKeyMate:
    build:
      targets:
        ZeroKeyMate: all
        NativeAcceptance: [test]
        ProductUITests: [test]
    test:
      gatherCoverageData: true
      targets: [NativeAcceptance, ProductUITests]
