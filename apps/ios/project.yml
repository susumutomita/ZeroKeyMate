name: ZeroKeyMate
options:
  bundleIdPrefix: com.zerokeymate
  deploymentTarget:
    iOS: '26.0'
  xcodeVersion: '26.3'
packages:
  MateCore:
    path: ../..
  Privy:
    url: https://github.com/privy-io/privy-ios.git
    exactVersion: 2.15.0
  Verity:
    path: ../../.tools/verity
settings:
  base:
    SWIFT_VERSION: '5.0'
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: '26.0'
    TARGETED_DEVICE_FAMILY: '1'
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: '$(MATE_DEVELOPMENT_TEAM)'
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: '0.2.0'
    CURRENT_PROJECT_VERSION: '2'
targets:
  ZeroKeyMate:
    type: application
    platform: iOS
    sources:
      - path: ZeroKeyMate
        excludes: ['Info.plist']
    dependencies:
      - package: MateCore
      - package: Privy
      - package: Verity
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zerokeymate.companion
        INFOPLIST_KEY_CFBundleDisplayName: Mate
        INFOPLIST_KEY_NSCameraUsageDescription: 周りの大まかな様子をこの端末内で認識し、DockKitの追尾に使います。映像は保存・外部送信しません。
        INFOPLIST_KEY_NSMicrophoneUsageDescription: 話すボタンを押したときだけ、端末内の音声認識に使います。
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: 音声を文字に変換します。端末内認識が使えない場合は文字入力に切り替えます。
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: あなたのMacで動く専門サービスに、承認した依頼内容だけを送ります。
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: YES
    info:
      path: Generated/Info.plist
      properties:
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
  NativeAcceptance:
    type: bundle.unit-test
    platform: iOS
    sources: [NativeAcceptance]
    dependencies:
      - target: ZeroKeyMate
      - package: MateCore
      - package: Verity
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zerokeymate.native-acceptance
        TEST_HOST: '$(BUILT_PRODUCTS_DIR)/ZeroKeyMate.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/ZeroKeyMate'
        BUNDLE_LOADER: '$(TEST_HOST)'
  ProductUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [ProductUITests]
    dependencies:
      - target: ZeroKeyMate
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zerokeymate.product-ui-tests
        TEST_TARGET_NAME: ZeroKeyMate
schemes:
  ZeroKeyMate:
    build:
      targets:
        ZeroKeyMate: all
        NativeAcceptance: [test]
        ProductUITests: [test]
    test:
      gatherCoverageData: true
      targets: [NativeAcceptance, ProductUITests]
