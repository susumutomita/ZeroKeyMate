# Diagnostic preview only: iOS acceptance has not completed. Normal project.yml builds neither link nor enable it.
include:
  - project.yml
packages:
  LiteRTLM:
    path: ../../.tools/litertlm-sdk
settings:
  base:
    SWIFT_ACTIVE_COMPILATION_CONDITIONS: '$(inherited) ${MATE_SWIFT_RUNTIME_FLAG} MATE_EMBEDDING_PREVIEW'
