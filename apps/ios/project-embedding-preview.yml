    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: '$(inherited) DEBUG ${MATE_SWIFT_RUNTIME_FLAG} MATE_EMBEDDING_PREVIEW'
targets:
  ZeroKeyMate:
    dependencies:
      - package: LiteRTLM
