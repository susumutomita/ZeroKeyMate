name: Enforcement acceptance
on:
  push:
    branches: [feat/complete-companion, main]
    paths: ['contracts/**', 'services/api/**', 'scripts/compile-contracts.mjs', 'package*.json', '.github/workflows/enforcement.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  enforcement:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - run: npm install --ignore-scripts
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.3.1
      - run: npm test
      - run: node scripts/compile-contracts.mjs --tests
      - run: npm run test:contracts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: enforcement-evidence
          path: |
            .build/contracts
            package-lock.json
