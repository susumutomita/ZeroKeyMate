name: Cryptographic acceptance
on:
  push:
    branches: [main]
    paths: ['circuits/**', 'contracts/**', 'services/**', 'scripts/**', 'config/*.json', 'package*.json', 'Makefile', '.github/workflows/proofs.yml']
  pull_request:
    paths: ['circuits/**', 'contracts/**', 'services/**', 'scripts/**', 'config/*.json', 'package*.json', 'Makefile', '.github/workflows/proofs.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  proofs:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/cache@v4
        with:
          path: |
            .tools
            ~/.cargo
          key: provekit-1.0.1-linux-${{ hashFiles('services/verifier/Cargo.lock') }}
      - run: npm ci --ignore-scripts
      - run: make proofs
      - run: cargo +nightly-2026-03-04 build --release --locked --manifest-path services/verifier/Cargo.toml
      - run: npm run test:proofs
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.3.1
      - run: node scripts/compile-contracts.mjs --tests
      - run: npm run test:local
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: proof-evidence
          path: |
            .build/proofs
            services/verifier/Cargo.lock
          include-hidden-files: true
