name: Native product acceptance
on:
  push:
    branches: [feat/complete-companion, main]
    paths: ['apps/**', 'Sources/**', 'Tests/**', 'Package.swift', 'scripts/generate-app-config.mjs', '.github/workflows/native.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  native:
    runs-on: macos-15
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      VERITY_SWIFT_SDK_MODE: release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - run: npm install --ignore-scripts && node scripts/generate-app-config.mjs
      - name: Download independently verified circuit artifacts
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: '33935057069'
          name: proof-evidence
          path: .build/circuit-evidence
      - name: Bundle the real circuit
        run: |
          mkdir -p apps/ios/ZeroKeyMate/Resources/Proofs
          for name in mate_policy.pkp mate_policy.pkv manifest.json; do
            source=$(find .build/circuit-evidence -name "$name" -type f | head -1)
            test -n "$source"
            cp "$source" apps/ios/ZeroKeyMate/Resources/Proofs/
          done
      - run: swift --version && xcodebuild -version && make test
      - run: brew install xcodegen && make project
      - name: Build native device code including DockKit
        run: |
          set -o pipefail
          mkdir -p .build/native-evidence
          xcodebuild -quiet -project apps/ios/ZeroKeyMate.xcodeproj -scheme ZeroKeyMate -configuration Debug -destination 'generic/platform=iOS' -derivedDataPath DerivedDataDevice CODE_SIGNING_ALLOWED=NO build 2>&1 | tee .build/native-evidence/device-build.log
      - name: Run native proof acceptance on Apple Silicon Simulator
        run: |
          set -o pipefail
          python3 - <<'PY' > .build/simulator-id
          import json, subprocess
          devices=json.loads(subprocess.check_output(['xcrun','simctl','list','devices','available','--json']))['devices']
          matches=[d for runtime,ds in devices.items() if 'iOS-26-2' in runtime for d in ds if d['name']=='iPhone 17 Pro']
          assert matches, 'iOS 26.2 iPhone runtime unavailable'
          print(matches[0]['udid'])
          PY
          id=$(cat .build/simulator-id)
          xcrun simctl boot "$id" || true
          xcrun simctl bootstatus "$id" -b
          xcodebuild -quiet -project apps/ios/ZeroKeyMate.xcodeproj -scheme ZeroKeyMate -configuration Debug -destination "platform=iOS Simulator,id=$id" -derivedDataPath DerivedData -resultBundlePath .build/native.xcresult ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO test 2>&1 | tee .build/native-evidence/simulator-tests.log
          app=$(xcrun simctl get_app_container "$id" com.zerokeymate.companion data)
          if [ -d "$app/tmp/mate-native-evidence" ]; then cp -R "$app/tmp/mate-native-evidence/." .build/native-evidence/; fi
          xcrun simctl launch "$id" com.zerokeymate.companion
          sleep 3
          xcrun simctl io "$id" screenshot .build/native-evidence/portrait.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-evidence
          path: |
            .build/native-evidence
            .build/native.xcresult
            apps/ios/ZeroKeyMate.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
          include-hidden-files: true
