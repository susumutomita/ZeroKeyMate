name: Native cryptographic acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  circuit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            .tools
            ~/.cargo
          key: provekit-1.0.1-linux-${{ hashFiles('services/verifier/Cargo.lock') }}
      - run: make proofs
      - uses: actions/upload-artifact@v4
        with:
          name: prepared-circuit
          path: apps/ios/ZeroKeyMate/Resources/Proofs
  native:
    runs-on: macos-15
    needs: circuit
    timeout-minutes: 75
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/cache@v4
        with:
          path: |
            .tools/provekit-source/target
            ~/.cargo/registry
            ~/.cargo/git
          key: native-provekit-4e011438-${{ hashFiles('scripts/build-native-runtime.sh') }}
      - run: make native-runtime
      - uses: actions/download-artifact@v4
        with:
          name: prepared-circuit
          path: apps/ios/ZeroKeyMate/Resources/Proofs
      - run: npm ci --ignore-scripts
      - run: make build-device
      - run: ./mate --verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-acceptance
          path: |
            .build/native-evidence
            .tools/verity/output/Verity.xcframework/mate-runtime.json
          include-hidden-files: true
