name: Build evidence
on:
  push:
    branches: [feat/complete-companion]
    paths: ['.github/workflows/build-evidence.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  native-diagnostics:
    runs-on: macos-15
    timeout-minutes: 10
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: susumutomita/ZeroKeyMate
          run-id: '33946323429'
          name: native-evidence
          path: previous
      - name: Export actual XCTest failures and screenshots
        run: |
          mkdir -p diagnostics/screens
          xcrun xcresulttool get test-results summary --path previous/.build/native.xcresult > diagnostics/summary.json
          xcrun xcresulttool get test-results tests --path previous/.build/native.xcresult > diagnostics/tests.json
          xcrun xcresulttool export attachments --path previous/.build/native.xcresult --output-path diagnostics/screens
          cat diagnostics/summary.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-diagnostics
          path: diagnostics
  public-toolchains:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - run: npm install --ignore-scripts
      - name: Record package audit
        run: npm audit --json > audit.json || test -s audit.json
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.3.1
      - uses: actions/cache/restore@v4
        with:
          path: |
            .tools
            ~/.cargo/registry
            ~/.cargo/git
          key: provekit-1.0.1-linux-v2
      - run: bash scripts/build-proofs.sh
      - run: cargo +nightly-2026-03-04 build --release --manifest-path services/verifier/Cargo.toml
      - name: Package verified public tools for independent local execution
        run: |
          mkdir -p evidence/bin
          cp .tools/bin/provekit-cli services/verifier/target/release/mate-verify evidence/bin/
          cp "$(command -v anvil)" evidence/bin/
          tar -czf evidence/node-dependencies.tar.gz node_modules package-lock.json
          cp audit.json evidence/
          cp services/verifier/Cargo.lock evidence/
          tar -czf evidence/proof-resources.tar.gz -C .build/proofs .
          sha256sum evidence/bin/* evidence/*.tar.gz > evidence/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: public-toolchain-evidence
          path: evidence
          retention-days: 7
