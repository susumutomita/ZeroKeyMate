name: Source and protocol checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: source-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - run: npm run check:sources
      - run: find services scripts contracts -name '*.mjs' -print0 | xargs -0 -n1 node --check
      - run: npm audit --audit-level=high
      - run: npm test
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.3.1
      - run: node scripts/compile-contracts.mjs --tests
      - run: npm run test:contracts
  portable-swift:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: swift test --parallel
