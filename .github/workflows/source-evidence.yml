name: Source evidence
on:
  push:
    branches: [feat/complete-companion]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: git archive --format=tar.gz -o source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: source-evidence
          path: source.tar.gz
          retention-days: 7
